name = "fxi-telegram-edge"
main = "cloudflare-free/entry.py"
compatibility_date = "2026-11-11"
compatibility_flags = ["python_workers"]
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "fxi_bot_prod"
database_id = "c31fe782-6cc2-41ff-a9a0-3e7504d3f319"

[observability]
enabled = true

[observability.traces]
enabled = true

[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

[limits]
cpu_ms = 30000

[python_modules]
excludes = ["**/*.pyc", "**/__pycache__"]
