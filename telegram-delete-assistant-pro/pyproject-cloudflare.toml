[project]
name = "fxi-telegram-cloudflare"
version = "0.1.0"
description = "FXI Telegram bot running as a Cloudflare Python Worker"
requires-python = ">=3.14"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp==3.13.5",
    "fastapi==0.110.0",
    "itsdangerous>=2.2,<3.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8,<9",
    "httpx>=0.27,<0.28",
]

[tool.uv]
override-dependencies = ["pydantic==2.14.3"]
