[project]
name = "fxi-telegram-cloudflare"
version = "0.1.0"
description = "FXI Telegram bot running as a Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.13,<4.0",
    "aiohttp>=3.9.3,<3.10",
    "fastapi>=0.115,<1.0",
    "itsdangerous>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
