[project]
name = "fxi-telegram-cloudflare"
version = "0.1.0"
description = "FXI Telegram bot running as a Cloudflare Python Worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.13,<4.0",
    "aiohttp>=3.10,<4.0",
    "fastapi==0.110.0",
    "itsdangerous>=2.2,<3.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
