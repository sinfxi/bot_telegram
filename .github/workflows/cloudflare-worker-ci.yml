name: Cloudflare Worker CI

on:
  push:
    branches:
      - cloudflare-free-migration
    paths:
      - "telegram-delete-assistant-pro/cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker-ci.yml"
  pull_request:
    paths:
      - "telegram-delete-assistant-pro/cloudflare/worker/**"
      - ".github/workflows/cloudflare-worker-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-delete-assistant-pro/cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply fxi_bot_prod --local
