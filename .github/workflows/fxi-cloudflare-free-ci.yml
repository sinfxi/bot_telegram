name: FXI Cloudflare Free validation

on:
  push:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/cloudflare-free/**"
      - ".github/workflows/fxi-cloudflare-free-ci.yml"
  pull_request:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/cloudflare-free/**"
      - ".github/workflows/fxi-cloudflare-free-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate D1 schema with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("telegram-delete-assistant-pro/cloudflare-free/schema.sql").read_text())
          names = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"schema_migrations", "fxi_bot_state", "fxi_chat_messages", "fxi_community_messages", "telegram_updates"}
          missing = required - names
          if missing:
              raise SystemExit(f"Missing D1 tables: {sorted(missing)}")
          print("D1 schema syntax and required tables: OK")
          PY
      - name: Bundle Worker with Wrangler dry run
        working-directory: telegram-delete-assistant-pro/cloudflare-free/worker
        run: |
          npm install --global wrangler@4
          wrangler deploy --dry-run
