name: FXI Cloudflare Python Worker

on:
  pull_request:
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/cloudflare-python-worker.yml"
  push:
    branches:
      - "feature/cloudflare-python-webhook-runtime"
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/cloudflare-python-worker.yml"

jobs:
  package-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: telegram-delete-assistant-pro/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: telegram-delete-assistant-pro
        run: uv sync --only-dev
      - name: Compile bot and Worker entrypoint
        run: |
          python -m compileall -q telegram-delete-assistant-pro/zeus_bot.py
          python -m compileall -q telegram-delete-assistant-pro/cloudflare-free/entry.py
      - name: Verify Python package imports
        working-directory: telegram-delete-assistant-pro
        run: uv run python -c "import aiogram, aiohttp, fastapi, itsdangerous; print('runtime imports: ok')"
      - name: Validate Cloudflare Worker bundle
        working-directory: telegram-delete-assistant-pro
        run: uv run pywrangler --help
