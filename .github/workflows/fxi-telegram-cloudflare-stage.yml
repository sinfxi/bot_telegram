name: FXI Telegram Cloudflare Python staging

on:
  push:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/cloudflare-python/**"
      - ".github/workflows/fxi-telegram-cloudflare-stage.yml"
  workflow_dispatch:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-delete-assistant-pro/cloudflare-python
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install project and Workers SDK
        run: uv sync
      - name: Compile Worker
        run: uv run python -m compileall -q src tests
      - name: Run runtime contract tests
        run: uv run pytest -q
      - name: Validate D1 migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("migrations/0001_initial.sql").read_text(encoding="utf-8"))
          names = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"fxi_py_updates", "fxi_py_messages", "fxi_py_channel_posts"}
          assert expected <= names, names
          print("D1 migration SQL syntax OK")
          PY
      - name: Deploy staging Worker when Cloudflare credential exists
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            uv run pywrangler deploy
          else
            echo "Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
          fi
