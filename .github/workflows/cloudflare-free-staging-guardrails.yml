name: Cloudflare Free Staging Guardrails
on:
  push:
    branches: [feature/cloudflare-free-staging-isolation]
  pull_request:
    branches: [feature/cloudflare-free-webhook-migration, main]
permissions:
  contents: read
jobs:
  staging-safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-delete-assistant-pro/cloudflare-free/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate staging config, webhook guards and retry behavior
        run: python -m unittest discover -s tests -v
      - name: Install Wrangler
        run: npm install
      - name: Compile Worker without deploying
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: Preserve compiled staging bundle for controlled upload
        uses: actions/upload-artifact@v4
        with:
          name: fxi-telegram-edge-staging-bundle
          path: telegram-delete-assistant-pro/cloudflare-free/worker/dist/**
          if-no-files-found: error
          retention-days: 1
