name: FXI Cloudflare Free staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fxi-cloudflare-free-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-delete-assistant

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Wrangler
        run: npm install --global wrangler@4

      - name: Validate D1 migration and deploy isolated staging Worker
        working-directory: telegram-delete-assistant-pro/cloudflare-free/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler d1 execute fxi-telegram-assistant-stage --remote --file=../schema.sql
          wrangler deploy
