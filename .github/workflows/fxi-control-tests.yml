name: FXI Control security and syntax tests

on:
  push:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/fxi-control-tests.yml"
  pull_request:
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/fxi-control-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-delete-assistant-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-delete-assistant-pro/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run panel security tests
        run: pytest -q
