name: FXI Control security and syntax tests

on:
  push:
    branches:
      - feature/cloudflare-python-webhook-runtime
      - feature/fxi-admin-owner-redesign
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/fxi-control-tests.yml"
  pull_request:
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/fxi-control-tests.yml"
  workflow_dispatch:

concurrency:
  group: fxi-control-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telegram-delete-assistant-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: telegram-delete-assistant-pro/pyproject.toml
      - name: Select Cloudflare runtime manifest
        run: cp pyproject-cloudflare.toml pyproject.toml
      - name: Install dependencies
        run: uv sync
      - name: Compile Python modules
        run: uv run python -m compileall -q .
      - name: Smoke-test bot application and Aiogram/Pydantic compatibility
        run: |
          uv run python -c "import zeus_bot; print('FXI bot application import: ok')"
          uv run python -c "from aiogram import Bot; from aiogram.types import Update; bot=Bot('123456:ABCDEF'); Update.model_validate({'update_id': 1}, context={'bot': bot}); print('Aiogram/Pydantic smoke test: ok')"
      - name: Run panel security tests
        run: uv run pytest -q
