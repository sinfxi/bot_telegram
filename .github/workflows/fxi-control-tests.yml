name: FXI Control security and syntax tests

on:
  push:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/fxi-control-tests.yml"
  pull_request:
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/fxi-control-tests.yml"
  workflow_dispatch:

concurrency:
  group: fxi-control-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: telegram-delete-assistant-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-delete-assistant-pro/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run panel security tests
        run: pytest -q

      - name: Check panel and redeploy automatically when offline
        if: github.event_name != 'pull_request'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbhkdtmc6qcc73flckgg
          PANEL_URL: https://telegram-delete-assistant-pro.onrender.com
        shell: bash
        run: |
          set -Eeuo pipefail

          check_panel() {
            local health login
            health="$(curl -sSL --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "$PANEL_URL/health" || true)"
            login="$(curl -sSL --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "$PANEL_URL/login" || true)"
            echo "Panel probe: health=$health login=$login"
            [[ "$health" == "200" && "$login" == "200" ]]
          }

          wait_for_panel() {
            local attempts="$1" delay="$2" attempt
            for ((attempt=1; attempt<=attempts; attempt++)); do
              echo "Panel availability check $attempt/$attempts"
              if check_panel; then
                return 0
              fi
              if (( attempt < attempts )); then sleep "$delay"; fi
            done
            return 1
          }

          if wait_for_panel 3 10; then
            echo "FXI Control is healthy; no redeploy required."
            exit 0
          fi

          echo "::warning::FXI Control did not respond after repeated probes."
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::RENDER_API_KEY is missing. Add it as a repository Actions secret."
            exit 1
          fi

          deploy_response_file="$(mktemp)"
          http_code="$(curl -sS --connect-timeout 10 --max-time 45 \
            -o "$deploy_response_file" -w '%{http_code}' -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}' || true)"

          if [[ "$http_code" != "201" && "$http_code" != "200" ]]; then
            echo "::error::Render deploy request failed (HTTP $http_code). Response:"
            cat "$deploy_response_file"
            rm -f "$deploy_response_file"
            exit 1
          fi

          deploy_id="$(jq -r '.id // empty' "$deploy_response_file")"
          rm -f "$deploy_response_file"
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render accepted no usable deployment ID."
            exit 1
          fi
          echo "Render deployment created: $deploy_id"

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            deploy_response="$(curl --fail -sS --connect-timeout 10 --max-time 30 \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json")"
            status="$(jq -r '.status // "unknown"' <<< "$deploy_response")"
            echo "Render deployment status: $status"

            case "$status" in
              live)
                if wait_for_panel 6 10; then
                  echo "FXI Control recovered and both health/login endpoints returned HTTP 200."
                  exit 0
                fi
                echo "::warning::Deployment is live, but the panel endpoints are not healthy yet."
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Render deployment ended with status: $status"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::FXI Control did not recover within 20 minutes."
          exit 1
