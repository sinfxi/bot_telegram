name: Python validation

on:
  push:
    branches:
      - feature/personal-account-automation
    paths:
      - "foodmind.py"
      - "requirements.txt"
      - "tests/test_core.py"
      - "scripts/**"
      - ".github/workflows/python-check.yml"
  pull_request:
    paths:
      - "foodmind.py"
      - "requirements.txt"
      - "tests/test_core.py"
      - "scripts/**"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r telegram-delete-assistant-pro/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q telegram-delete-assistant-pro
      - name: Check admin panel JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("telegram-delete-assistant-pro/static/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline admin script found")
          Path("/tmp/fxi-admin.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/fxi-admin.js
      - name: Import app module
        working-directory: telegram-delete-assistant-pro
        env:
          ADMIN_PASSWORD: "ci-only-placeholder"
          DB_PATH: "/tmp/fxi-test.sqlite3"
        run: python -c "import app; print('app import ok')"
