name: FXI Cloudflare infrastructure smoke test

on:
  push:
    branches:
      - feature/cloudflare-python-webhook-runtime
    paths:
      - ".github/workflows/cloudflare-smoke.yml"
      - "telegram-delete-assistant-pro/cloudflare-free/entry.py"
  workflow_dispatch:

concurrency:
  group: fxi-cloudflare-infrastructure-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WORKER_URL: https://fxi-telegram-edge.fxi-media-engine.workers.dev
    steps:
      - name: Check Worker and D1 health (bot remains explicitly not-ready)
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --max-time 20 --retry 5 --retry-delay 3 --retry-connrefused "$WORKER_URL/health")"
          echo "$response"
          echo "$response" | jq -e '.ok == true and .database == "connected" and .bot_ready == false and .status == "infrastructure_only"'
