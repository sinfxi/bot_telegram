name: Telegram assistant Python checks

on:
  push:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/telegram-delete-assistant-ci.yml"
  pull_request:
    branches:
      - feature/telegram-delete-assistant
    paths:
      - "telegram-delete-assistant-pro/**"
      - ".github/workflows/telegram-delete-assistant-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r telegram-delete-assistant-pro/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q telegram-delete-assistant-pro
      - name: Check admin dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("telegram-delete-assistant-pro/static/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S)
          if not scripts:
              raise SystemExit("Admin dashboard script was not found")
          Path("/tmp/fxi-admin.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/fxi-admin.js
      - name: Check login page JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("telegram-delete-assistant-pro/panel_auth.py").read_text(encoding="utf-8")
          match = re.search(r'page = """(.*?)"""', source, flags=re.S)
          if not match:
              raise SystemExit("Login page template was not found")
          scripts = re.findall(r"<script>(.*?)</script>", match.group(1), flags=re.S)
          if not scripts:
              raise SystemExit("Login page script was not found")
          Path("/tmp/fxi-login.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/fxi-login.js
      - name: Import app and verify authentication routes
        working-directory: telegram-delete-assistant-pro
        env:
          ZEUS_BOT_TOKEN: "ci-placeholder-token"
          ADMIN_PANEL_USERNAME: "ci-admin"
          ADMIN_PANEL_PASSWORD: "ci-placeholder-password"
          SESSION_SECRET: "ci-placeholder-session-secret"
        run: |
          python - <<'PY'
          import app
          paths = {route.path for route in app.app.routes}
          required = {"/login", "/auth/admin-login", "/auth/logout", "/admin/api/users/{user_id}/block", "/admin/api/users/{user_id}/unblock", "/admin/api/community", "/admin/api/community/{chat_id}/settings"}
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing auth routes: {sorted(missing)}")
          forbidden = {"/auth/register", "/auth/user-login", "/account"}
          present_forbidden = forbidden & paths
          if present_forbidden:
              raise SystemExit(f"Public panel account routes must not exist: {sorted(present_forbidden)}")
          print("Application import, admin-only authentication, and Telegram user access routes OK")
          PY
